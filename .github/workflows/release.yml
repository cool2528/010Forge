name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure
        run: cmake -S . -B build -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build all targets from source
        run: cmake --build build
      - name: Test deployment, resources and languages
        run: ctest --test-dir build --output-on-failure
      - name: Package single EXE, bilingual docs and screenshots
        id: package
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = if ($env:REF_TYPE -eq 'tag') { $env:REF_NAME } else { 'dev-' + '${{ github.sha }}'.Substring(0, 8) }
          cmake --install build --prefix release --config Release
          if ($LASTEXITCODE -ne 0) { throw 'CMake install failed' }
          $exe = 'release/010Forge.exe'
          if (!(Test-Path $exe)) { throw 'Missing release EXE' }
          foreach ($img in @('localized-ui.png', 'gui-tool.png', 'licensed-about.png')) {
            if (!(Test-Path "release/images/$img")) { throw "Missing README image: $img" }
          }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  010Forge.exe" | Set-Content 'release/SHA256SUMS.txt' -Encoding ascii
          $zip = "010Forge_$version.zip"
          Compress-Archive -Path 'release/*' -DestinationPath $zip -Force
          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$zipHash  $zip" | Set-Content "$zip.sha256" -Encoding ascii
          "zip=$zip" >> $env:GITHUB_OUTPUT
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: 010Forge-windows-x64
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.zip }}.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Check out source tree stays clean
        run: |
          if (git status --porcelain) { throw 'The build modified the source tree' }

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download tested package
        uses: actions/download-artifact@v4
        with:
          name: 010Forge-windows-x64
          path: assets
      - name: Publish tagged release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            assets/010Forge_*.zip
            assets/010Forge_*.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
